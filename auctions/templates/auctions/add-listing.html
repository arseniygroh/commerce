{% extends "auctions/layout.html" %}

{% block body %}
    <div class="content">
        <h2 id="main-title" style="text-align: center;">Listing Creation</h2>
        <form class="add-form" action="{% url 'add' %}" method="post">
            {% csrf_token %}
            <div class="form-block">
                <label for="listing-title">Title:</label>
                <input type="text" name="listing-title" id="listing-title">
            </div>
            <div class="form-block">
                <label for="listing-desc">Description:</label>
                <textarea id="listing-desc" name="listing-desc" rows="4" cols="50"></textarea>
            </div>
            <div class="form-block">
                <label for="listing-bid">Starting bid:</label>
                <input type="number" name="listing-bid" id="listing-bid">
            </div>
            <div class="form-block">
                <label for="listing-image">Image url:</label>
                <input type="text" name="listing-image" id="listing-image">
            </div>
            <div class="form-block">
                <label for="listing-category">Category:</label>
                <input type="text" name="listing-category" id="listing-category">
            </div>
            <button type="submit">Create</button>
        </form>
    </div>
{% endblock %}
